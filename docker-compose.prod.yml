version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trufit-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-trufit_production}
      - DB_USERNAME=${DB_USERNAME:-trufit}
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME="${APP_NAME:-TruFit}"
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost:5173}
    depends_on:
      - postgres
      - redis
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - trufit-network

  frontend:
    build:
      context: ./frontend/webapp
      dockerfile: Dockerfile
    container_name: trufit-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=${APP_URL:-http://localhost:8000}/api
    networks:
      - trufit-network

  postgres:
    image: postgres:16-alpine
    container_name: trufit-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-trufit_production}
      - POSTGRES_USER=${DB_USERNAME:-trufit}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - trufit-network

  redis:
    image: redis:7-alpine
    container_name: trufit-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - trufit-network

  nginx:
    image: nginx:alpine
    container_name: trufit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - frontend
    networks:
      - trufit-network

volumes:
  postgres-data:
  redis-data:
  app-storage:

networks:
  trufit-network:
    driver: bridge
